[package]
edition.workspace = true
license.workspace = true
name = "fm-encrypted-skills"
version.workspace = true

[lib]
name = "fm_encrypted_skills"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-shell-command = { workspace = true }
codex-protocol = { workspace = true }
fm-product-policy = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

# Real envelope backends (software / ukey / ukey-two-phase) backed by
# `fmsh-ukey-core`, hard-bound on the platform where the vendor SDK ships.
# The upstream repo vendors `libfmsh_ukey_sdk.so` under vendor/, so no
# FMSH_UKEY_SDK_DIR is needed at build time; the ukey modes still need
# FMSH_UKEY_PROVIDER / FMSH_UKEY_CONTAINER (and the hardware) at runtime.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
fmsh-ukey-core = { git = "http://192.168.131.126:8089/jiangzhengqi/fmsh-ukey-lib.git", rev = "9c479813182d7f37c3fcae2c4a80342e1e3188ee" }
fmsh-ukey-skill = { git = "http://192.168.131.126:8089/jiangzhengqi/fmsh-ukey-lib.git", rev = "9c479813182d7f37c3fcae2c4a80342e1e3188ee" }

[dev-dependencies]
anyhow = { workspace = true }
codex-utils-path-uri = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
