# Upstream CI sets RUST_MIN_STACK=8388608 globally (.github/workflows/rust-ci*.yml);
# some test binaries (e.g. codex-queue-extension queue_service) overflow the default
# 2 MiB test-thread stack without it. Mirror that env here so local `cargo test` and
# `just test` behave like CI.
[env]
RUST_MIN_STACK = "8388608"

# Full-fat (internal GitLab deps enabled) check/test entry points. Default
# builds need none of those dependencies; these aliases turn both fm feature
# gates on. Workspace-wide only: with `-p <pkg>` the other crate's feature is
# not in the unit graph and cargo rejects it — use direct flags instead,
# e.g. `cargo test -p fm-license --features lmclient`.
[alias]
fm-check = "check --features fm-license/lmclient,fm-encrypted-skills/ukey"
fm-test = "test --features fm-license/lmclient,fm-encrypted-skills/ukey"

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
