[package]
name = "fmsh-ukey-cipher"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Pluggable file encryption/decryption library and CLI (noop / local / ukey / ukey-two-phase)"

[dependencies]
fmsh-ukey-wrapper = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
openssl = { version = "0.10.76", features = ["vendored"] }
parking_lot = "0.12"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
