[package]
name = "fmsh-ukey-wrapper"
version = "0.3.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "fmsh_ukey_wrapper"
crate-type = ["rlib", "cdylib"]

[dependencies]
parking_lot = "0.12"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# FFI fns take raw pointers; safety contract documented per-fn.
not_unsafe_ptr_arg_deref = "allow"
