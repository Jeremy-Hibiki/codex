[package]
name = "fm-license"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fm_license"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-core = { workspace = true }
tracing = { workspace = true }

[features]
# Enables the real LMCLIENT-backed license checkout and pulls in the internal
# GitLab dependency. On by default so the real license-gate code path is
# always compiled; against the vendor/dummy placeholder the SDK is a
# non-enforcing stub (see vendor/dummy/lmclient-rust-sdk). Disable with
# --no-default-features for a build without the dependency.
lmclient = ["dep:lmclient-rust-sdk", "dep:signal-hook"]
default = ["lmclient"]

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
lmclient-rust-sdk = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
